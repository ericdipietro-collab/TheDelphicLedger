[project]
name = "delphic-ledger"
version = "0.1.0"
description = "Six investment philosophies. Zero consensus. A local portfolio analysis engine."
authors = [{name = "Eric DiPietro"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = ["finance", "portfolio", "investment", "rebalancing", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer[all]>=0.12",
    "sqlalchemy>=2.0",
    "rapidfuzz>=3",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dateutil>=2.9",
    "requests>=2.32",
    "yfinance>=0.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "sqlalchemy[mypy]>=2.0",
    "import-linter>=2",
    "responses>=0.25",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ericdipietro-collab/DelphiLedger"
Repository = "https://github.com/ericdipietro-collab/DelphiLedger"

[project.scripts]
committee = "committee.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/committee"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette"]

[tool.importlinter]
root_packages = ["committee"]

[[tool.importlinter.contracts]]
name = "oracles must not import rebalancer"
type = "forbidden"
source_modules = ["committee.oracles"]
forbidden_modules = ["committee.rebalancer"]

[[tool.importlinter.contracts]]
name = "rebalancer must not import signals or oracles"
type = "forbidden"
source_modules = ["committee.rebalancer"]
forbidden_modules = ["committee.signals", "committee.oracles"]
