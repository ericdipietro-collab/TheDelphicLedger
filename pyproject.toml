[project]
name = "committee"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "sqlalchemy>=2.0",
    "rapidfuzz>=3",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "sqlalchemy[mypy]>=2.0",
    "import-linter>=2",
]

[project.scripts]
committee = "committee.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/committee"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

