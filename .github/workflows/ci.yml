name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run mypy src/committee/core src/committee/oracles src/committee/rebalancer src/committee/signals

      - name: Test
        run: uv run pytest tests/ -q

      - name: Import contracts
        run: uv run lint-imports
